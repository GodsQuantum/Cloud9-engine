name: HIP r111 gfx1103 (experimental)

on:
  push:
    branches:
      - lab/20261022-one-engine-qualification
    paths:
      - .github/workflows/hip-r111-gfx1103.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hip-r111-gfx1103-experimental
  cancel-in-progress: false

jobs:
  hip-gfx1103:
    runs-on: ubuntu-24.04
    timeout-minutes: 325
    steps:
      - name: Checkout lab source lock
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare reproducible build environment
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq git cmake ninja-build build-essential patchelf libnuma-dev libcurl4-openssl-dev
          python3 -m venv "$RUNNER_TEMP/rocm-venv"
          "$RUNNER_TEMP/rocm-venv/bin/python" -m pip install --disable-pip-version-check --no-cache-dir \
            --index-url https://stable.repo.amd.com/rocm/whl-next/ \
            'rocm[libraries,devel,device-gfx1103]==10.0.0'
          echo "VENV=$RUNNER_TEMP/rocm-venv" >> "$GITHUB_ENV"
          df -h "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
      - name: Reconstruct exact v14 r111 patch set
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          git clone --filter=blob:none https://github.com/stew675/llama-cpp-rdna-boosts.git rdna-release
          git -C rdna-release checkout --detach '2a16c4b1f7592106d5652f56cc9e3c7adf95e395'
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git llama-upstream
          git -C llama-upstream checkout --detach '097cf33d9499b1eade67d51e16d7c75427e7b267'
          git -C llama-upstream config user.email 'cloud9-actions@users.noreply.github.com'
          git -C llama-upstream config user.name 'Cloud9 Actions'
          python3 - "$GITHUB_WORKSPACE/tools/benchmarks/rdna_r111_source_lock_20261022.json" "$RUNNER_TEMP/rdna-release" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          j=json.loads(Path(sys.argv[1]).read_text())
          rel=Path(sys.argv[2])
          assert len(j['patch_sha256'])==j['patch_count']==14
          for filename,sha in sorted(j['patch_sha256'].items()):
              patch=rel/'patches'/filename
              assert patch.is_file(),f'RELEASE_PATCH_MISSING: {filename}'
              assert hashlib.sha256(patch.read_bytes()).hexdigest()==sha,f'RELEASE_PATCH_CHANGED: {filename}'
          print('PATCHES_SHA256_VALID_14_OF_14')
          PY
          bash "$RUNNER_TEMP/rdna-release/scripts/apply-all.sh" "$RUNNER_TEMP/llama-upstream"
          ACTUAL=$(git -C "$RUNNER_TEMP/llama-upstream" rev-parse HEAD^{tree})
          test "$ACTUAL" = e51b1023a42b1183c3fca8b93be677ffa4cb194b
          echo 'PATCH_TREE_SHA_VERIFIED' "$ACTUAL"
      - name: Build HIP for gfx1103 only (single worker)
        shell: bash
        run: |
          set -euo pipefail
          source "$VENV/bin/activate"
          ROCM_ROOT=$(rocm-sdk path --root)
          test -d "$ROCM_ROOT"
          echo "ROCM_ROOT=$ROCM_ROOT" >> "$GITHUB_ENV"
          export ROCM_PATH="$ROCM_ROOT"
          export HIP_PATH="$ROCM_ROOT"
          export PATH="$ROCM_ROOT/bin:$ROCM_ROOT/lib/llvm/bin:$PATH"
          export LD_LIBRARY_PATH="$ROCM_ROOT/lib:${LD_LIBRARY_PATH:-}"
          cmake -S "$RUNNER_TEMP/llama-upstream" -B "$RUNNER_TEMP/hip-r111-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DGGML_HIP=ON -DGPU_TARGETS=gfx1103 \
            -DGGML_HIP_RCCL=OFF -DLLAMA_CURL=OFF \
            -DCMAKE_HIP_COMPILER="$ROCM_ROOT/lib/llvm/bin/clang++"
          cmake --build "$RUNNER_TEMP/hip-r111-build" --parallel 1 --target llama-server llama-cli test-backend-ops
          echo HIP_COMPILE_TARGETS_PASS
      - name: Package relocatable experimental ELF binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/package/bin"
          cp -a "$RUNNER_TEMP/hip-r111-build/bin/." "$RUNNER_TEMP/package/bin/"
          find "$RUNNER_TEMP/package/bin" -maxdepth 1 -type f -print0 | while IFS= read -r -d '' file; do
            if readelf -d "$file" 2>/dev/null | grep -Eq '\((RUNPATH|RPATH)\)'; then
              patchelf --set-rpath '$ORIGIN' "$file"
            fi
          done
          printf '%s\n' 'HIP r111 experimental; no GPU proof, Cloud9 Radeon qualification required' > "$RUNNER_TEMP/package/NO_GPU_CERTIFICATION.txt"
          (cd "$RUNNER_TEMP/package" && find bin -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd "$RUNNER_TEMP/package" && tar -czf "$GITHUB_WORKSPACE/hip-r111-gfx1103-lab.tar.gz" bin SHA256SUMS NO_GPU_CERTIFICATION.txt)
          sha256sum "$GITHUB_WORKSPACE/hip-r111-gfx1103-lab.tar.gz"
      - name: Store only candidate build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hip-r111-gfx1103-uncertified
          path: hip-r111-gfx1103-lab.tar.gz
          if-no-files-found: error
          retention-days: 7
