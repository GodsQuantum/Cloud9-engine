# Cloud9 native zram-generator (2026-10-25): additive LOW-priority burst only.
# zram0 and zram1 are unchanged; avoids exhausting their memory limits.
# No custom wrapper or boot script. Only zram2 is new.
[zram2]
zram-size = 4096
zram-resident-limit = 2048
compression-algorithm = lz4
swap-priority = 60
